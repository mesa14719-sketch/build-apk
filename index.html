<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>App Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px;
    background: #0d1117; color: #c9d1d9; min-height: 100vh; user-select: none; -webkit-user-select: none; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8b949e; font-size: 13px; margin: 0 0 20px; }
  label { display: block; margin-top: 14px; font-size: 13px; color: #8b949e; }
  input[type="text"], input[type="url"] { width: 100%; padding: 12px; margin-top: 4px;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 15px; font-family: inherit; }
  input:focus { outline: none; border-color: #1f6feb; }
  input[type="file"] { margin-top: 4px; color: #8b949e; font-size: 13px; }
  button { margin-top: 20px; width: 100%; padding: 14px; border: none; border-radius: 8px;
    font-size: 16px; cursor: pointer; color: #fff; font-family: inherit; }
  #buildBtn { background: #238636; }
  #downloadBtn { background: #1f6feb; display: none; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:active:not(:disabled) { transform: scale(0.98); }
  #status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 13px;
    display: none; word-wrap: break-word; white-space: pre-wrap; }
  .ok { background: #1a2e1a; border: 1px solid #238636; color: #3fb950; display: block; }
  .err { background: #2e1a1a; border: 1px solid #da3633; color: #f85149; display: block; }
  .info { background: #161b22; border: 1px solid #30363d; color: #8b949e; display: block; }
  .hint { font-size: 11px; color: #484f58; margin-top: 3px; }
</style>
</head>
<body>

<h1>App Builder</h1>
<p class="sub">رابط المستودع، اسم التطبيق، صورة — ثم ابنِ</p>

<label>رابط مستودع المشروع</label>
<input type="url" id="projectUrl" placeholder="https://github.com/username/my-app" />

<label>اسم التطبيق</label>
<input type="text" id="appName" placeholder="MyApp" />

<label>صورة التطبيق</label>
<input type="file" id="appIcon" accept="image/*" />

<button id="buildBtn" onclick="startBuild()">Build APK</button>
<button id="downloadBtn" onclick="downloadArtifact()">تحميل APK</button>
<div id="status"></div>

<script>
const GH_TOKEN = "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";
const BUILDER_OWNER = 'mesa14719-sketch';
const BUILDER_REPO  = 'build-apk';

const statusEl = document.getElementById('status');
const buildBtn = document.getElementById('buildBtn');
const downloadBtn = document.getElementById('downloadBtn');
let ctx = null;

function show(m, c) { statusEl.textContent = m; statusEl.className = c; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

function parseRepo(url) {
  const cleaned = url.replace(/^https?:\/\//, '').replace(/^www\./, '');
  const parts = cleaned.split('/').filter(Boolean);
  if (parts[0] === 'github.com') return { owner: parts[1], repo: parts[2].replace(/\.git$/, '') };
  return { owner: parts[0], repo: parts[1].replace(/\.git$/, '') };
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function ghFetch(url, opts = {}) {
  return fetch(url, { ...opts, headers: {
    Authorization: `token ${GH_TOKEN}`,
    Accept: 'application/vnd.github+json',
    ...(opts.headers || {}) } });
}

async function getDefaultBranch(owner, repo) {
  const res = await ghFetch(`https://api.github.com/repos/${owner}/${repo}`);
  if (!res.ok) throw new Error(`جلب المستودع: HTTP ${res.status}`);
  return (await res.json()).default_branch || 'main';
}

async function uploadFile(owner, repo, path, b64, branch) {
  const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  let sha = null;
  const g = await ghFetch(api);
  if (g.ok) sha = (await g.json()).sha;
  const body = { message: `update ${path}`, content: b64, branch };
  if (sha) body.sha = sha;
  const res = await ghFetch(api, { method: 'PUT',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(`رفع ${path}: ${e.message || res.status}`); }
}

// ينشئ .github/workflows/build-apk.yml من workflow.yml تلقائياً
async function ensureWorkflow(branch) {
  const wfPath = '.github/workflows/build-apk.yml';
  const check = await ghFetch(`https://api.github.com/repos/${BUILDER_OWNER}/${BUILDER_REPO}/contents/${wfPath}`);
  if (check.ok) return; // موجود مسبقاً

  show('إنشاء workflow تلقائياً...', 'info');
  const src = await ghFetch(`https://api.github.com/repos/${BUILDER_OWNER}/${BUILDER_REPO}/contents/workflow.yml`);
  if (!src.ok) throw new Error('workflow.yml غير موجود في الجذر');
  const srcData = await src.json();
  await uploadFile(BUILDER_OWNER, BUILDER_REPO, wfPath, srcData.content.replace(/\n/g, ''), branch);
  await sleep(3000); // انتظار تسجيل GitHub
}

async function collectRepoAsZip(owner, repo) {
  const branch = await getDefaultBranch(owner, repo);
  const treeRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`);
  if (!treeRes.ok) throw new Error(`جلب الشجرة: HTTP ${treeRes.status}`);
  const tree = await treeRes.json();
  const files = tree.tree.filter(t => t.type === 'blob' && !t.path.startsWith('.git/'));
  if (!files.length) throw new Error('المستودع فارغ');

  show(`جمع ${files.length} ملفاً...`, 'info');
  const zip = new JSZip();
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    show(`تنزيل ${i+1}/${files.length}: ${f.path}`, 'info');
    const fr = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(f.path).replace(/%2F/g, '/')}?ref=${branch}`);
    if (!fr.ok) throw new Error(`تنزيل ${f.path}: HTTP ${fr.status}`);
    const fd = await fr.json();
    if (fd.download_url) {
      const raw = await fetch(fd.download_url);
      if (!raw.ok) throw new Error(`محتوى ${f.path} فشل`);
      zip.file(f.path, await raw.blob());
    } else if (fd.content) {
      const bin = atob(fd.content.replace(/\n/g, ''));
      const arr = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
      zip.file(f.path, arr);
    }
  }
  return await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
}

async function waitForRun(since) {
  for (let i = 0; i < 90; i++) {
    await sleep(5000);
    const res = await ghFetch(`https://api.github.com/repos/${BUILDER_OWNER}/${BUILDER_REPO}/actions/runs?per_page=20`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const run = data.workflow_runs.find(r => new Date(r.created_at) >= since &&
      (r.event === 'repository_dispatch' || r.event === 'workflow_dispatch'));
    if (!run) continue;
    if (run.status === 'completed') {
      if (run.conclusion === 'success') return run;
      throw new Error(`البناء فشل: ${run.conclusion} — ${run.html_url}`);
    }
    show(`البناء: ${run.status}`, 'info');
  }
  throw new Error('انتهت المهلة');
}

async function fetchArtifact(runId) {
  const res = await ghFetch(`https://api.github.com/repos/${BUILDER_OWNER}/${BUILDER_REPO}/actions/runs/${runId}/artifacts`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const d = await res.json();
  if (!d.artifacts.length) throw new Error('لا يوجد APK');
  return d.artifacts[0];
}

async function startBuild() {
  const projUrl = document.getElementById('projectUrl').value.trim();
  const appName = document.getElementById('appName').value.trim();
  const iconFile = document.getElementById('appIcon').files[0];
  if (!projUrl || !appName) { show('املأ رابط المستودع واسم التطبيق', 'err'); return; }

  buildBtn.disabled = true;
  downloadBtn.style.display = 'none';

  try {
    const proj = parseRepo(projUrl);
    const builderBranch = await getDefaultBranch(BUILDER_OWNER, BUILDER_REPO);

    await ensureWorkflow(builderBranch);

    const zipBlob = await collectRepoAsZip(proj.owner, proj.repo);
    show('ضغط المشروع...', 'info');
    const zipB64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(zipBlob);
    });

    show('رفع ZIP...', 'info');
    await uploadFile(BUILDER_OWNER, BUILDER_REPO, 'input/project.zip', zipB64, builderBranch);

    let hasIcon = false;
    if (iconFile) {
      show('رفع الأيقونة...', 'info');
      await uploadFile(BUILDER_OWNER, BUILDER_REPO, 'input/icon.png', await fileToBase64(iconFile), builderBranch);
      hasIcon = true;
    }

    const since = new Date();
    show('إطلاق البناء...', 'info');
    const res = await ghFetch(`https://api.github.com/repos/${BUILDER_OWNER}/${BUILDER_REPO}/dispatches`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ event_type: 'build-apk', client_payload: { app_name: appName, has_icon: hasIcon } })
    });
    if (res.status !== 204) throw new Error(`dispatch: HTTP ${res.status}`);

    const run = await waitForRun(since);
    const art = await fetchArtifact(run.id);
    ctx = { artifactId: art.id, name: appName };
    show(`جاهز: ${art.name} (${(art.size_in_bytes/1024/1024).toFixed(1)} MB)`, 'ok');
    downloadBtn.style.display = 'block';
  } catch (e) {
    show(e.message, 'err');
  } finally {
    buildBtn.disabled = false;
  }
}

async function downloadArtifact() {
  if (!ctx) return;
  try {
    show('تنزيل...', 'info');
    const res = await ghFetch(`https://api.github.com/repos/${BUILDER_OWNER}/${BUILDER_REPO}/actions/artifacts/${ctx.artifactId}/zip`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${ctx.name}-apk.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    show('تم التنزيل.', 'ok');
  } catch (e) {
    show(e.message, 'err');
  }
}
</script>

</body>
</html>
