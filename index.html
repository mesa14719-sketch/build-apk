<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>App Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0; padding: 16px; background: #0d1117; color: #c9d1d9;
    min-height: 100vh; user-select: none; -webkit-user-select: none;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8b949e; font-size: 13px; margin: 0 0 20px; }
  label { display: block; margin-top: 14px; font-size: 13px; color: #8b949e; }
  input[type="text"], input[type="password"], input[type="url"] {
    width: 100%; padding: 12px; margin-top: 4px;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    color: #c9d1d9; font-size: 15px; font-family: inherit;
  }
  input:focus { outline: none; border-color: #1f6feb; }
  input[type="file"] { margin-top: 4px; color: #8b949e; font-size: 13px; }
  button {
    margin-top: 20px; width: 100%; padding: 14px;
    border: none; border-radius: 8px; font-size: 16px;
    cursor: pointer; color: #fff; font-family: inherit;
  }
  #buildBtn { background: #238636; }
  #downloadBtn { background: #1f6feb; display: none; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:active:not(:disabled) { transform: scale(0.98); }
  #status {
    margin-top: 16px; padding: 12px; border-radius: 8px;
    font-size: 13px; display: none; word-wrap: break-word;
    white-space: pre-wrap;
  }
  .ok { background: #1a2e1a; border: 1px solid #238636; color: #3fb950; display: block; }
  .err { background: #2e1a1a; border: 1px solid #da3633; color: #f85149; display: block; }
  .info { background: #161b22; border: 1px solid #30363d; color: #8b949e; display: block; }
  .hint { font-size: 11px; color: #484f58; margin-top: 3px; }
</style>
</head>
<body>

<h1>App Builder</h1>
<p class="sub">اختر مستودعاً، اسمَ تطبيق، صورة، ثم ابنِ</p>

<label>رابط مستودع المشروع</label>
<input type="url" id="projectUrl" placeholder="https://github.com/username/my-app" />
<div class="hint">يجب أن يحتوي على index.html في الجذر أو مجلد فرعي</div>

<label>اسم التطبيق</label>
<input type="text" id="appName" placeholder="MyApp" />

<label>صورة التطبيق (اختياري)</label>
<input type="file" id="appIcon" accept="image/*" />

<label>GitHub Token</label>
<input type="password" id="ghToken" placeholder="ghp_... أو github_pat_..." />
<div class="hint">يُستخدم لهذه الجلسة فقط. لا يُخزّن.</div>

<button id="buildBtn" onclick="startBuild()">Build APK</button>
<button id="downloadBtn" onclick="downloadArtifact()">تحميل APK</button>
<div id="status"></div>

<script>
const BUILDER_OWNER = 'mesa14719-sketch';
const BUILDER_REPO  = 'build-apk';

const statusEl = document.getElementById('status');
const buildBtn = document.getElementById('buildBtn');
const downloadBtn = document.getElementById('downloadBtn');
let ctx = null;

function show(m, c) { statusEl.textContent = m; statusEl.className = c; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

function parseRepo(url) {
  const cleaned = url.replace(/^https?:\/\//, '').replace(/^www\./, '');
  const parts = cleaned.split('/').filter(Boolean);
  if (parts[0] === 'github.com') {
    if (parts.length < 3) throw new Error('رابط المستودع ناقص');
    return { owner: parts[1], repo: parts[2].replace(/\.git$/, '') };
  }
  if (parts.length < 2) throw new Error('صيغة الرابط غير صحيحة');
  return { owner: parts[0], repo: parts[1].replace(/\.git$/, '') };
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function ghFetch(url, token, opts = {}) {
  return fetch(url, {
    ...opts,
    headers: {
      Authorization: `token ${token}`,
      Accept: 'application/vnd.github+json',
      ...(opts.headers || {})
    }
  });
}

async function getDefaultBranch(owner, repo, token) {
  const res = await ghFetch(`https://api.github.com/repos/${owner}/${repo}`, token);
  if (!res.ok) throw new Error(`جلب المستودع: HTTP ${res.status}`);
  return (await res.json()).default_branch || 'main';
}

async function uploadFile(owner, repo, token, path, b64, branch) {
  const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  let sha = null;
  const g = await ghFetch(api, token);
  if (g.ok) sha = (await g.json()).sha;
  const body = { message: `upload ${path}`, content: b64, branch };
  if (sha) body.sha = sha;
  const res = await ghFetch(api, token, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(`رفع ${path}: ${err.message || res.status}`);
  }
}

async function collectRepoAsZip(owner, repo, token) {
  const branch = await getDefaultBranch(owner, repo, token);
  const treeRes = await ghFetch(
    `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`, token
  );
  if (!treeRes.ok) throw new Error(`جلب الشجرة: HTTP ${treeRes.status}`);
  const tree = await treeRes.json();
  const files = tree.tree.filter(t => t.type === 'blob' && !t.path.startsWith('.git/'));
  if (!files.length) throw new Error('المستودع فارغ');

  show(`جمع ${files.length} ملفاً (${branch})...`, 'info');
  const zip = new JSZip();

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    show(`تنزيل ${i+1}/${files.length}: ${f.path}`, 'info');
    const fileRes = await ghFetch(
      `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(f.path).replace(/%2F/g, '/')}?ref=${branch}`,
      token
    );
    if (!fileRes.ok) throw new Error(`تنزيل ${f.path}: HTTP ${fileRes.status}`);
    const fileData = await fileRes.json();
    if (fileData.download_url) {
      const raw = await fetch(fileData.download_url);
      if (!raw.ok) throw new Error(`تنزيل محتوى ${f.path} فشل`);
      zip.file(f.path, await raw.blob());
    } else if (fileData.content) {
      const bin = atob(fileData.content.replace(/\n/g, ''));
      const arr = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
      zip.file(f.path, arr);
    }
  }
  return await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
}

async function waitForRun(token, since) {
  for (let i = 0; i < 90; i++) {
    await sleep(5000);
    const res = await ghFetch(
      `https://api.github.com/repos/${BUILDER_OWNER}/${BUILDER_REPO}/actions/runs?per_page=20`, token
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const run = data.workflow_runs.find(r =>
      new Date(r.created_at) >= since &&
      (r.event === 'repository_dispatch' || r.event === 'workflow_dispatch')
    );
    if (!run) continue;
    if (run.status === 'completed') {
      if (run.conclusion === 'success') return run;
      throw new Error(`البناء فشل: ${run.conclusion} — ${run.html_url}`);
    }
    show(`البناء: ${run.status}`, 'info');
  }
  throw new Error('انتهت المهلة (7.5 دقائق)');
}

async function fetchArtifact(token, runId) {
  const res = await ghFetch(
    `https://api.github.com/repos/${BUILDER_OWNER}/${BUILDER_REPO}/actions/runs/${runId}/artifacts`, token
  );
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const d = await res.json();
  if (!d.artifacts.length) throw new Error('لا يوجد APK');
  return d.artifacts[0];
}

async function startBuild() {
  const projUrl = document.getElementById('projectUrl').value.trim();
  const appName = document.getElementById('appName').value.trim();
  const token = document.getElementById('ghToken').value.trim();
  const iconFile = document.getElementById('appIcon').files[0];

  if (!projUrl || !appName || !token) {
    show('املأ رابط المستودع، اسم التطبيق، والتوكن', 'err');
    return;
  }

  buildBtn.disabled = true;
  downloadBtn.style.display = 'none';

  try {
    const proj = parseRepo(projUrl);
    const builderBranch = await getDefaultBranch(BUILDER_OWNER, BUILDER_REPO, token);

    const zipBlob = await collectRepoAsZip(proj.owner, proj.repo, token);
    show('ضغط المشروع...', 'info');
    const zipB64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(zipBlob);
    });

    show('رفع ZIP...', 'info');
    await uploadFile(BUILDER_OWNER, BUILDER_REPO, token, 'input/project.zip', zipB64, builderBranch);

    let hasIcon = false;
    if (iconFile) {
      show('رفع الأيقونة...', 'info');
      await uploadFile(BUILDER_OWNER, BUILDER_REPO, token, 'input/icon.png', await fileToBase64(iconFile), builderBranch);
      hasIcon = true;
    }

    const since = new Date();
    show('إطلاق البناء...', 'info');
    const res = await ghFetch(
      `https://api.github.com/repos/${BUILDER_OWNER}/${BUILDER_REPO}/dispatches`, token, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event_type: 'build-apk', client_payload: { app_name: appName, has_icon: hasIcon } })
      }
    );
    if (res.status !== 204) {
      const err = await res.json().catch(() => ({}));
      throw new Error(`dispatch: HTTP ${res.status} — ${err.message || 'راجع صلاحيات التوكن'}`);
    }

    const run = await waitForRun(token, since);
    const art = await fetchArtifact(token, run.id);
    ctx = { token, artifactId: art.id, name: appName };
    show(`جاهز: ${art.name} (${(art.size_in_bytes/1024/1024).toFixed(1)} MB)`, 'ok');
    downloadBtn.style.display = 'block';
  } catch (e) {
    show(e.message, 'err');
  } finally {
    buildBtn.disabled = false;
  }
}

async function downloadArtifact() {
  if (!ctx) return;
  try {
    show('تنزيل...', 'info');
    const res = await ghFetch(
      `https://api.github.com/repos/${BUILDER_OWNER}/${BUILDER_REPO}/actions/artifacts/${ctx.artifactId}/zip`, ctx.token
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${ctx.name}-apk.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    show('تم التنزيل. فك الضغط، ثبّت APK.', 'ok');
  } catch (e) {
    show(e.message, 'err');
  }
}
</script>

</body>
</html>
