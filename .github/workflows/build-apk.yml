name: Build APK
on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify inputs
        run: |
          ls -la input/ || echo "input missing"
          test -f input/project.zip || { echo "project.zip missing"; exit 1; }
      - name: Unzip
        run: |
          mkdir -p www
          unzip -o input/project.zip -d www/
          test -f www/index.html || { echo "index.html missing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MyApp" "com.example.myapp" --web-dir=www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: output/
