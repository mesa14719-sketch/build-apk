- name: بناء APK
        run: |
          cd "$ROOT"
          
          # 1. حذف مسار الجافا الثابت
          find . -name "gradle.properties" -type f -exec sed -i '/org.gradle.java.home/d' {} \;
          
          # 2. رفع Gradle إلى 9.3.1
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          fi
          
          # 3. رفع Android Gradle Plugin إلى 9.1.1
          # نبحث في settings.gradle و build.gradle
          find android -name "*.gradle" -type f | while read file; do
            # تحديث في plugins block
            sed -i 's/com.android.application[^"]*version[^"]*"[0-9.]*"/com.android.application" version "9.1.1"/g' "$file"
            sed -i 's/com.android.library[^"]*version[^"]*"[0-9.]*"/com.android.library" version "9.1.1"/g' "$file"
            # تحديث في الطريقة القديمة (classpath)
            sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:9.1.1/g" "$file"
          done
          
          echo "=== محتوى settings.gradle ==="
          cat android/settings.gradle 2>/dev/null || true
          echo "=== محتوى build.gradle ==="
          cat android/build.gradle 2>/dev/null || true
          
          flutter pub get
          flutter build apk --release
