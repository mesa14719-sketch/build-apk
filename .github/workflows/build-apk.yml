name: Build APK

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: اقرأ المدخلات
        id: cfg
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          [ -z "$APP_NAME" ] && APP_NAME="ProxyPin"
          SAFE_NAME=$(echo "$APP_NAME" | tr -cd 'A-Za-z0-9')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="ProxyPin"
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: فك ضغط المشروع
        run: |
          mkdir -p project
          if ls *.zip 1>/dev/null 2>&1; then
            FIRST_ZIP=$(ls *.zip | head -1)
            echo "استخدام $FIRST_ZIP"
            unzip -o "$FIRST_ZIP" -d project/
          else
            echo "ما لقيت أي ZIP"; exit 1
          fi

          ROOT=""
          if [ -f "project/pubspec.yaml" ]; then
            ROOT="project"
          else
            while IFS= read -r d; do
              if [ -f "$d/pubspec.yaml" ]; then
                ROOT="$d"; break
              fi
            done < <(find project -mindepth 1 -maxdepth 2 -type d)
          fi

          if [ -z "$ROOT" ]; then
            echo "ما لقيت pubspec.yaml"
            find project -maxdepth 3 -type f | head -50
            exit 1
          fi

          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "جذر المشروع: $ROOT"

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: بناء APK
        run: |
          cd "$ROOT"

          # ===== 1. حذف مسار الجافا الثابت =====
          find . -name "gradle.properties" -type f -exec sed -i '/org.gradle.java.home/d' {} \;

          # ===== 2. رفع Gradle إلى 9.5.0 =====
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
            echo "=== gradle-wrapper.properties ==="
            cat android/gradle/wrapper/gradle-wrapper.properties
          fi

          # ===== 3. رفع AGP إلى 9.3.1 (في كل الملفات المحتملة) =====
          for f in android/settings.gradle android/settings.gradle.kts android/build.gradle android/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/id[[:space:]]*"com.android.application"[[:space:]]*version[[:space:]]*"[0-9.]*"/id "com.android.application" version "9.3.1"/g' "$f"
              sed -i 's/id[[:space:]]*"com.android.library"[[:space:]]*version[[:space:]]*"[0-9.]*"/id "com.android.library" version "9.3.1"/g' "$f"
              sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:9.3.1/g" "$f"
            fi
          done

          # ===== 4. إصلاح ProGuard =====
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i "s|getDefaultProguardFile('proguard-android.txt')|getDefaultProguardFile('proguard-android-optimize.txt')|g" "$f"
              sed -i 's|getDefaultProguardFile("proguard-android.txt")|getDefaultProguardFile("proguard-android-optimize.txt")|g' "$f"
            fi
          done

          # ===== 5. تعطيل DSL الجديد لـ AGP 9 و Kotlin المدمج =====
          GP="android/gradle.properties"
          if [ ! -f "$GP" ]; then
            touch "$GP"
          fi
          grep -q "^android.newDsl=" "$GP" && sed -i 's|^android.newDsl=.*|android.newDsl=false|' "$GP" || echo "android.newDsl=false" >> "$GP"
          grep -q "^android.builtInKotlin=" "$GP" && sed -i 's|^android.builtInKotlin=.*|android.builtInKotlin=false|' "$GP" || echo "android.builtInKotlin=false" >> "$GP"
          echo "=== gradle.properties ==="
          cat "$GP"

          # ===== 6. طباعة الملفات للتشخيص =====
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle 2>/dev/null || cat android/settings.gradle.kts 2>/dev/null || true
          echo "=== android/build.gradle ==="
          cat android/build.gradle 2>/dev/null || cat android/build.gradle.kts 2>/dev/null || true

          # ===== 7. البناء =====
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: نسخ APK
        run: |
          mkdir -p output
          find "$ROOT/build/app/outputs" -name "*.apk" -exec cp {} "output/${{ steps.cfg.outputs.SAFE_NAME }}.apk" \;
          ls -lh output/
          test -f "output/${{ steps.cfg.outputs.SAFE_NAME }}.apk" || { echo "ما انتج APK"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.SAFE_NAME }}-apk
          path: output/
          retention-days: 7
