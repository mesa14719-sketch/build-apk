name: Build APK from Uploaded Project

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:   # للتشخيص اليدوي

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: قراءة المدخلات والتحقق
        id: cfg
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          HAS_ICON="${{ github.event.client_payload.has_icon }}"
          [ -z "$APP_NAME" ] && APP_NAME="MyApp"
          [ -z "$HAS_ICON" ] && HAS_ICON="false"
          # تأكد أن الاسم ASCII فقط لـ cap init
          SAFE_NAME=$(echo "$APP_NAME" | tr -cd 'A-Za-z0-9')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="MyApp"
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_OUTPUT
          echo "HAS_ICON=$HAS_ICON" >> $GITHUB_OUTPUT
          echo "=== input/ ==="
          ls -la input/ || echo "input/ مفقود"
          test -f input/project.zip || { echo "project.zip مفقود"; exit 1; }
          echo "=== حجم ZIP ==="
          du -h input/project.zip

      - name: فك ضغط المشروع
        run: |
          mkdir -p www
          unzip -o input/project.zip -d www/
          # إذا ZIP فيه مجلد واحد فقط، ارفع محتواه
          count=$(ls -1 www | wc -l)
          if [ "$count" -eq 1 ] && [ -d "www/$(ls -1 www | head -1)" ]; then
            inner=$(ls -1 www | head -1)
            mv www/$inner/* www/ 2>/dev/null || true
            mv www/$inner/.* www/ 2>/dev/null || true
            rmdir www/$inner 2>/dev/null || true
          fi
          ls -la www/ | head -30
          test -f www/index.html || { echo "www/index.html مفقود"; exit 1; }

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: تثبيت Capacitor وبناء APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "${{ steps.cfg.outputs.SAFE_NAME }}" "com.example.${{ steps.cfg.outputs.SAFE_NAME }}" --web-dir=www
          npx cap add android
          npx cap sync android
          if [ "${{ steps.cfg.outputs.HAS_ICON }}" = "true" ] && [ -f "input/icon.png" ]; then
            find android/app/src/main/res -name "ic_launcher*.png" -exec cp input/icon.png {} \;
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: نسخ APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk "output/${{ steps.cfg.outputs.SAFE_NAME }}.apk"
          ls -lh output/

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.SAFE_NAME }}-apk
          path: output/
          retention-days: 7
