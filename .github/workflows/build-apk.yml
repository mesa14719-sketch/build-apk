name: Build APK
on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: قراءة المدخلات
        id: cfg
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          HAS_ICON="${{ github.event.client_payload.has_icon }}"
          [ -z "$APP_NAME" ] && APP_NAME="MyApp"
          [ -z "$HAS_ICON" ] && HAS_ICON="false"
          SAFE_NAME=$(echo "$APP_NAME" | tr -cd 'A-Za-z0-9')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="MyApp"
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          echo "SAFE_NAME=$SAFE_NAME" >> $GITHUB_OUTPUT
          echo "HAS_ICON=$HAS_ICON" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME safe=$SAFE_NAME has_icon=$HAS_ICON"

      - name: تحضير المشروع
        run: |
          mkdir -p www
          if [ -f input/project.zip ]; then
            unzip -o input/project.zip -d www/
            count=$(ls -1 www | wc -l)
            if [ "$count" -eq 1 ] && [ -d "www/$(ls -1 www | head -1)" ]; then
              inner=$(ls -1 www | head -1)
              mv www/$inner/* www/ 2>/dev/null || true
              mv www/$inner/.* www/ 2>/dev/null || true
              rmdir www/$inner 2>/dev/null || true
            fi
          else
            cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyApp</title>
          <style>body{font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0d1117;color:#c9d1d9}h1{font-size:28px}</style></head>
          <body><div style="text-align:center"><h1>مرحباً من MyApp</h1><p>مشروع تجريبي</p></div></body></html>
          EOF
          fi
          test -f www/index.html || { echo "index.html missing"; ls -laR www/ | head -50; exit 1; }
          ls -la www/ | head -20

      - name: إعداد Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: إعداد Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: بناء APK بـ Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "${{ steps.cfg.outputs.SAFE_NAME }}" "com.example.${{ steps.cfg.outputs.SAFE_NAME }}" --web-dir=www
          npx cap add android
          npx cap sync android

          # فرض Java 21 و SDK 35 في gradle
          cd android
          cat >> variables.gradle <<'EOF'

          ext {
              minSdkVersion = 23
              compileSdkVersion = 35
              targetSdkVersion = 35
          }
          EOF

          # تأكيد compileOptions
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('app/build.gradle')
          s = p.read_text()
          if 'compileOptions' not in s:
              s = s.replace('android {', '''android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          ''', 1)
          p.write_text(s)
          print("compileOptions patched")
          PY

          if [ "${{ steps.cfg.outputs.HAS_ICON }}" = "true" ] && [ -f "../input/icon.png" ]; then
            find app/src/main/res -name "ic_launcher*.png" -exec cp ../input/icon.png {} \;
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: نسخ APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk "output/${{ steps.cfg.outputs.SAFE_NAME }}.apk"
          ls -lh output/

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.SAFE_NAME }}-apk
          path: output/
          retention-days: 7
